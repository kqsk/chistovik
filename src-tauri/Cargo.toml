[package]
name = "chistovik"
version = "0.1.0"
description = "Чистовик"
edition = "2021"
license = "MIT"

[lib]
name = "chistovik_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2.5"
tauri-plugin-global-shortcut = "2.4"
tauri-plugin-store = "2.5"
window-vibrancy = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
keyring-core = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "io-util", "sync"] }
tokio-util = "0.7"
futures-util = "0.3"
thiserror = "2"
windows-native-keyring-store = "1"
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
rusqlite = { version = "0.40", features = ["bundled"] }

[target.'cfg(windows)'.dependencies]
# Same versions as wry's, for ICoreWebView2_19 (memory target of hidden windows).
webview2-com = "0.39"
windows-core-062 = { package = "windows-core", version = "0.62" }
windows = { version = "0.61.3", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Globalization",
  "Win32_Graphics_Dwm",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_DataExchange",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_Registry",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_Security",
  "Win32_UI_Accessibility",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_HiDpi",
] }

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true
panic = "abort"
